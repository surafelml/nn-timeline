project:
  type: book
  output-dir: ../_site

book:
  title: "NN Timeline"
  subtitle: "Neural network architectures through time"
  author: "Surafel M. Lakew"
  repo-url: https://github.com/surafelml/nn-timeline
  chapters:
    - index.qmd
    - part: "Foundations"
      chapters:
        - 00_foundations/00_historical.qmd
        - 00_foundations/01_artificial_neuron.qmd
        - 00_foundations/02_information_theory.qmd
        - 00_foundations/03_activations.qmd
        - 00_foundations/04_mlp_backprop.qmd
        - 00_foundations/05_gradient_flow.qmd
        - 00_foundations/06_optimization.qmd
    - part: "RNN & CNN Era"
      chapters:
        - 01_rnn/00_embeddings.qmd
        - 01_rnn/01_rnn_bptt.qmd
        - 01_rnn/02_lstm_gru.qmd
        - 01_rnn/03_seq2seq.qmd
        - 01_rnn/04_convseq2seq.qmd
        - 01_rnn/05_attention.qmd
    - part: "Transformer Era"
      chapters:
        - 02_transformer/00_landscape.qmd
        - 02_transformer/01_self_attention.qmd
        - 02_transformer/02_transformer.qmd
        - 02_transformer/03_positional_encoding.qmd
        - 02_transformer/04_bert_gpt.qmd
        - 02_transformer/05_decoding.qmd
        - 02_transformer/06_scaling_laws.qmd
        - 02_transformer/07_alignment.qmd
        - 02_transformer/08_language_models.qmd
        - 02_transformer/09_moe.qmd
        - 02_transformer/10_beyond_transformers.qmd
        - 02_transformer/11_multimodal.qmd
        - 02_transformer/12_diffusion.qmd
        - 02_transformer/13_embodied.qmd
    - part: "Supplementary (Mathematical)"
      chapters:
        - supp/00_prerequisites.qmd
        - supp/01_artificial_neuron_numerical.qmd
        - supp/04_mlp_backprop_numerical.qmd
    - part: "Supplementary (Training Techniques)"
      chapters:
        - supp/modern_activations.qmd
        - supp/modern_optimizers.qmd
        - supp/normalization.qmd
        - supp/regularization.qmd
    - part: "Supplementary (Vision & Generative)"
      chapters:
        - supp/cnn_vision_lineage.qmd
        - supp/self_supervised.qmd
        - supp/generative_models.qmd
    - part: "Supplementary (Classical ML)"
      chapters:
        - supp/classical_ml/00_overview.qmd
        - supp/classical_ml/01_linear_probabilistic.qmd
        - supp/classical_ml/02_svm_kernels.qmd
        - supp/classical_ml/03_trees_ensembles.qmd
        - supp/classical_ml/04_unsupervised.qmd
    - part: "Supplementary (Transformer)"
      chapters:
        - supp/kv_cache.qmd
        - supp/efficient_attention.qmd
        - landscape/transformer_era.qmd
    - part: "Supplementary (RL & Agents)"
      chapters:
        - supp/deep_rl.qmd
        - supp/agents/00_overview.qmd
        - supp/agents/01_rag.qmd
        - supp/agents/02_tool_use.qmd
        - supp/agents/03_multi_agent.qmd
    - part: "Future Outlook"
      chapters:
        - future/00_world_models.qmd
        - future/01_reasoning.qmd
        - future/02_roads_not_taken.qmd
    - references.qmd

bibliography: references.bib
csl: sort-by-year.csl
link-citations: true
link-bibliography: true
citations-hover: true
suppress-bibliography: false

format:
  html:
    theme:
      light: [cosmo, custom.scss]
      dark: [darkly, custom.scss]
    code-fold: false
    toc: true
