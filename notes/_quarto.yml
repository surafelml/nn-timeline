project:
  type: book
  output-dir: ../_site

book:
  title: "nn_timeline"
  subtitle: "Neural network architectures through time"
  author: "Surafel M. Lakew"
  repo-url: https://github.com/surafelml/nn-timeline
  chapters:
    - index.qmd
    - part: "Foundations"
      chapters:
        - 00_foundations/00_historical.qmd
        - 00_foundations/01_artificial_neuron.qmd
        - 00_foundations/02_information_theory.qmd
        - 00_foundations/03_activations.qmd
        - 00_foundations/04_mlp_backprop.qmd
        - 00_foundations/05_gradient_flow.qmd
        - 00_foundations/06_optimization.qmd
    - part: "RNN Era"
      chapters:
        - 01_rnn/01_rnn_bptt.qmd
        - 01_rnn/02_lstm_gru.qmd
        - 01_rnn/03_seq2seq.qmd
        - 01_rnn/04_attention_bahdanau.qmd
        - 01_rnn/05_attention_luong.qmd
    - part: "Transformer Era"
      chapters:
        - 02_transformer/01_self_attention.qmd
        - 02_transformer/02_transformer.qmd
        - 02_transformer/03_bert_gpt.qmd
        - 02_transformer/04_positional_encoding.qmd
        - 02_transformer/05_kv_cache.qmd
    - part: "Going Deeper (supplementary)"
      chapters:
        - supp/01_artificial_neuron_numerical.qmd
        - supp/04_mlp_backprop_numerical.qmd
    - references.qmd

bibliography: references.bib
csl: sort-by-year.csl
link-citations: true
link-bibliography: true
citations-hover: true
suppress-bibliography: false

format:
  html:
    theme:
      light: [cosmo, custom.scss]
      dark: [darkly, custom.scss]
    code-fold: false
    toc: true
