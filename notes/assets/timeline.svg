<svg viewBox="0 0 1200 360" xmlns="http://www.w3.org/2000/svg" style="font-family:system-ui,sans-serif;background:#fff">
  <style>
    text { font-size: 14px; font-weight: 600; fill: #1a202c; }
    .yr  { font-size: 12px; font-weight: 600; fill: #4a5568; }
    .yr-minor { font-size: 11px; font-weight: 400; fill: #a0aec0; }
    .axis { stroke: #2d3748; stroke-width: 2; }
    .tick-minor { stroke: #a0aec0; stroke-width: 1; }
    .dot-foundation  { fill: #d97706; }
    .dot-rnn         { fill: #2563eb; }
    .dot-transformer { fill: #7c3aed; }
    .lead { stroke: #cbd5e0; stroke-width: 1; stroke-dasharray: 2,3; fill: none; }
    .today-line { stroke: #e53e3e; stroke-width: 1.5; stroke-dasharray: 4,3; }
    .today-text { fill: #e53e3e; font-size: 11px; font-weight: 700; }
    .era-label { font-size: 11px; font-weight: 700; letter-spacing: 0.05em; fill: #718096; }
    .link-text { fill: #2563eb; }
  </style>

  <!-- era bands -->
  <rect x="40"  y="170" width="461" height="20" fill="#fef3c7" opacity="0.4" />
  <rect x="501" y="170" width="478" height="20" fill="#dbeafe" opacity="0.4" />
  <rect x="979" y="170" width="181" height="20" fill="#ede9fe" opacity="0.4" />

  <!-- era labels -->
  <text class="era-label" x="270" y="220" text-anchor="middle">FOUNDATIONS</text>
  <text class="era-label" x="740" y="220" text-anchor="middle">RNN ERA</text>
  <text class="era-label" x="1070" y="220" text-anchor="middle">TRANSFORMER ERA</text>

  <!-- main axis -->
  <line class="axis" x1="40" y1="180" x2="1170" y2="180" />
  <polygon points="1170,180 1158,174 1158,186" fill="#2d3748" />

  <!-- minor ticks every 5 years -->
  <line class="tick-minor" x1="73"   y1="176" x2="73"   y2="184" /><text class="yr-minor" x="73"   y="200" text-anchor="middle">1960</text>
  <line class="tick-minor" x1="155"  y1="176" x2="155"  y2="184" />
  <line class="tick-minor" x1="238"  y1="176" x2="238"  y2="184" /><text class="yr-minor" x="238"  y="200" text-anchor="middle">1970</text>
  <line class="tick-minor" x1="320"  y1="176" x2="320"  y2="184" />
  <line class="tick-minor" x1="402"  y1="176" x2="402"  y2="184" /><text class="yr-minor" x="402"  y="200" text-anchor="middle">1980</text>
  <line class="tick-minor" x1="485"  y1="176" x2="485"  y2="184" />
  <line class="tick-minor" x1="567"  y1="176" x2="567"  y2="184" /><text class="yr-minor" x="567"  y="200" text-anchor="middle">1990</text>
  <line class="tick-minor" x1="650"  y1="176" x2="650"  y2="184" />
  <line class="tick-minor" x1="732"  y1="176" x2="732"  y2="184" /><text class="yr-minor" x="732"  y="200" text-anchor="middle">2000</text>
  <line class="tick-minor" x1="814"  y1="176" x2="814"  y2="184" />
  <line class="tick-minor" x1="897"  y1="176" x2="897"  y2="184" /><text class="yr-minor" x="897"  y="200" text-anchor="middle">2010</text>
  <line class="tick-minor" x1="979"  y1="176" x2="979"  y2="184" />
  <line class="tick-minor" x1="1061" y1="176" x2="1061" y2="184" /><text class="yr-minor" x="1061" y="200" text-anchor="middle">2020</text>
  <line class="tick-minor" x1="1144" y1="176" x2="1144" y2="184" />

  <!-- today marker (2026) -->
  <line class="today-line" x1="1160" y1="60" x2="1160" y2="300" />
  <text class="today-text" x="1160" y="55" text-anchor="middle">today</text>

  <!-- 1943 MP Neuron (top) — x=40+(-15*16.47)≈ but anchor at 1943 = 40+(1943-1958)*16.47 = 40-246 → clamp to 40 -->
  <g transform="translate(40,180)">
    <line class="lead" x1="0" y1="-4" x2="0" y2="-55" />
    <circle class="dot-foundation" cx="0" cy="0" r="6" />
    <text class="yr" x="0" y="-63" text-anchor="middle">1943</text>
    <text class="link-text" x="0" y="-80" text-anchor="middle">MP Neuron</text>
  </g>

  <!-- 1958 Perceptron (bottom) — x=40 -->
  <g transform="translate(40,180)">
    <line class="lead" x1="0" y1="4" x2="0" y2="50" />
    <circle class="dot-foundation" cx="0" cy="0" r="6" />
    <text class="yr" x="0" y="62" text-anchor="middle">1958</text>
    <text class="link-text" x="0" y="78" text-anchor="middle">Perceptron</text>
  </g>

  <!-- 1986 RNN / BPTT (bottom) — x=501 -->
  <g transform="translate(501,180)">
    <line class="lead" x1="0" y1="4" x2="0" y2="90" />
    <circle class="dot-rnn" cx="0" cy="0" r="6" />
    <text class="yr" x="0" y="100" text-anchor="middle">1986</text>
    <text class="link-text" x="0" y="118" text-anchor="middle">RNN / BPTT</text>
  </g>

  <!-- 1997 LSTM (top) — x=683 -->
  <g transform="translate(683,180)">
    <line class="lead" x1="0" y1="-4" x2="0" y2="-70" />
    <circle class="dot-rnn" cx="0" cy="0" r="6" />
    <text class="yr" x="0" y="-78" text-anchor="middle">1997</text>
    <text class="link-text" x="0" y="-95" text-anchor="middle">LSTM</text>
  </g>

  <!-- 2014 Seq2Seq + GRU (bottom) — x=962 -->
  <g transform="translate(962,180)">
    <line class="lead" x1="0" y1="4" x2="0" y2="60" />
    <circle class="dot-rnn" cx="0" cy="0" r="6" />
    <text class="yr" x="0" y="72" text-anchor="middle">2014</text>
    <text class="link-text" x="0" y="90" text-anchor="middle">Seq2Seq / GRU</text>
  </g>

  <!-- 2015 Bahdanau + Luong (top) — x=979 -->
  <g transform="translate(979,180)">
    <line class="lead" x1="0" y1="-4" x2="0" y2="-50" />
    <circle class="dot-rnn" cx="0" cy="0" r="6" />
    <text class="yr" x="0" y="-58" text-anchor="middle">2015</text>
    <text class="link-text" x="0" y="-75" text-anchor="middle">Attention</text>
  </g>

  <!-- 2017 Transformer (bottom) — x=1012 -->
  <g transform="translate(1012,180)">
    <line class="lead" x1="0" y1="4" x2="0" y2="125" />
    <circle class="dot-transformer" cx="0" cy="0" r="6" />
    <text class="yr" x="0" y="137" text-anchor="middle">2017</text>
    <text class="link-text" x="0" y="155" text-anchor="middle">Transformer</text>
  </g>

  <!-- 2018 BERT + GPT (top) — x=1028 -->
  <g transform="translate(1028,180)">
    <line class="lead" x1="0" y1="-4" x2="0" y2="-115" />
    <circle class="dot-transformer" cx="0" cy="0" r="6" />
    <text class="yr" x="0" y="-123" text-anchor="middle">2018</text>
    <text class="link-text" x="0" y="-140" text-anchor="middle">BERT / GPT</text>
  </g>

  <!-- legend -->
  <g transform="translate(40,330)">
    <circle class="dot-foundation"  cx="6"   cy="0" r="5" />
    <text x="18"  y="4" style="font-size:12px;font-weight:400">Foundations</text>
    <circle class="dot-rnn"         cx="130" cy="0" r="5" />
    <text x="142" y="4" style="font-size:12px;font-weight:400">RNN family</text>
    <circle class="dot-transformer" cx="245" cy="0" r="5" />
    <text x="257" y="4" style="font-size:12px;font-weight:400">Transformer family</text>
  </g>
</svg>
