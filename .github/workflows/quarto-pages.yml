name: Quarto site → GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'notes/**'
      - '.github/workflows/quarto-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps for executable cells
        run: pip install jupyter ipykernel pyyaml numpy matplotlib

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Render Quarto book
        run: quarto render notes/

      - name: Disable Jekyll
        run: touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
